name: Deploy Wathiq Testnet Contracts

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-testnet-only to deploy worthless test contracts to BSC Testnet
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wathiq-testnet-deployment
  cancel-in-progress: false

jobs:
  deploy-testnet:
    if: ${{ inputs.confirmation == 'deploy-testnet-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile contracts
        run: npm run compile

      - name: Run contract tests before deployment
        run: npm test

      - name: Verify required secrets
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
        run: |
          test -n "$DEPLOYER_PRIVATE_KEY" || { echo "::error::Add DEPLOYER_PRIVATE_KEY as an Actions environment secret for the testnet-only deployer."; exit 1; }
          test -n "$BSC_TESTNET_RPC_URL" || { echo "::error::Add BSC_TESTNET_RPC_URL as an Actions environment secret."; exit 1; }
          case "$BSC_TESTNET_RPC_URL" in https://*) ;; *) echo "::error::RPC URL must use HTTPS."; exit 1 ;; esac

      - name: Deploy and verify testnet-only contracts
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BSC_TESTNET_RPC_URL: ${{ secrets.BSC_TESTNET_RPC_URL }}
        run: npx hardhat run scripts/deploy-testnet-suite.js --network bscTestnet

      - name: Publish verified deployment details
        if: success()
        run: |
          node <<'NODE'
          const d = require('./deployments/bsc-testnet.json');
          const fs = require('node:fs');
          const summary = [
            '## Wathiq BNB Testnet deployment',
            '',
            '- Chain ID: 97',
            '- Native-BNB escrow: [' + d.escrow.address + '](' + d.explorer.escrow + ')',
            '- Release/refund lifecycle smoke tests: ' + d.smokeTest.status,
            '',
            '**Testnet only. tBNB has no mainnet value; contract is unaudited.**',
            ''
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE
      - name: Upload deployment manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wathiq-bsc-testnet-deployment
          path: deployments/bsc-testnet.json
          if-no-files-found: error
          retention-days: 30
