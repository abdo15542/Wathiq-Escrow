
name: Wathiq CI

on:
  push:
    branches:
      - main
      - master
      - fix/mobile-api-production-config
      - feature/usdt-escrow
      - feature/production-readiness
      - feature/postgres-integration-tests
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wathiq-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-api-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wathiq_test
          POSTGRES_USER: wathiq
          POSTGRES_PASSWORD: wathiq_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wathiq -d wathiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate Render Blueprint YAML syntax
        run: ruby -e "require 'yaml'; YAML.load_file('render.yaml'); puts 'render.yaml syntax OK'"

      - name: Install contract dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile contracts
        run: npm run compile

      - name: Test contracts
        run: npm test

      - name: Install API dependencies
        run: npm install --prefix api --no-audit --no-fund

      - name: Test API
        env:
          DATABASE_URL: postgres://wathiq:wathiq_test_password@localhost:5432/wathiq_test
        run: npm run test:api

      - name: Check JavaScript syntax
        run: |
          node --check api/src/app.js
          node --check api/src/server.js
          node --check api/scripts/promote-admin.js
          node --check web/app.js
          node --check web/escrow.js
          node --check web/build.js

      - name: Build web assets
        run: npm run build:web

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: wathiq-web-dist
          path: web/dist/
          if-no-files-found: error

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android platform scaffolding
        working-directory: mobile
        run: flutter create --platforms=android --org ly.wathiq --project-name escrow .

      - name: Set Android application label
        working-directory: mobile
        run: sed -i 's/android:label="escrow"/android:label="واثق | Wathiq Escrow"/' android/app/src/main/AndroidManifest.xml

      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter source
        working-directory: mobile
        run: flutter analyze

      - name: Test Flutter app
        working-directory: mobile
        run: flutter test --reporter expanded

      - name: Warn when release API endpoint is not configured
        if: vars.WATHIQ_API_BASE_URL == ''
        run: echo "::warning::WATHIQ_API_BASE_URL is not set; Flutter analysis/tests will pass, but the release APK will be skipped until the deployed HTTPS API URL is configured."

      - name: Validate release API endpoint
        if: vars.WATHIQ_API_BASE_URL != ''
        env:
          WATHIQ_API_BASE_URL: ${{ vars.WATHIQ_API_BASE_URL }}
        run: |
          case "$WATHIQ_API_BASE_URL" in
            https://*) ;;
            *) echo "::error::WATHIQ_API_BASE_URL must use HTTPS."; exit 1 ;;
          esac

      - name: Build release APK
        if: vars.WATHIQ_API_BASE_URL != ''
        working-directory: mobile
        env:
          WATHIQ_API_BASE_URL: ${{ vars.WATHIQ_API_BASE_URL }}
        run: flutter build apk --release --dart-define=WATHIQ_API_BASE_URL="$WATHIQ_API_BASE_URL"

      - name: Upload Android APK
        if: vars.WATHIQ_API_BASE_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: wathiq-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
