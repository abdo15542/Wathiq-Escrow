name: Wathiq CI
on:
  push:
    branches: [main, master, feature/usdt-escrow]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wathiq-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts-api-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install contract dependencies
        run: npm install --no-audit --no-fund
      - name: Compile contracts
        run: npm run compile
      - name: Test contracts
        run: npm test
      - name: Install API dependencies
        run: npm --prefix api install --no-audit --no-fund
      - name: Test API
        run: npm run test:api
      - name: Build web assets
        run: npm run build:web
      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: wathiq-web-dist
          path: web/dist/
          if-no-files-found: error
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Generate Android platform scaffolding
        working-directory: mobile
        run: flutter create --platforms=android --project-name wathiq_mobile .
      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Flutter source
        working-directory: mobile
        run: flutter analyze
      - name: Test Flutter app
        working-directory: mobile
        run: flutter test --reporter expanded
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: wathiq-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
