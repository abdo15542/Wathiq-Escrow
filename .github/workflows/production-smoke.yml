name: Production Smoke Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/mobile-api-production-config
    paths:
      - ".github/workflows/production-smoke.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: wathiq-production-smoke
  cancel-in-progress: true

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production API readiness
        env:
          API_BASE_URL: https://wathiq-escrow-api.onrender.com
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 25 --retry 2 --retry-delay 3 \
            "$API_BASE_URL/health" --output /tmp/wathiq-health.json
          node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('/tmp/wathiq-health.json', 'utf8'));
          if (health.status !== 'ok' || health.service !== 'wathiq-api' || health.database !== 'connected') {
            console.error('API readiness response did not confirm PostgreSQL connectivity:', health);
            process.exit(1);
          }
          console.log('API readiness passed; PostgreSQL reports connected.');
          NODE

      - name: Check production website responds
        env:
          WEB_BASE_URL: https://wathiq-escrow-web.onrender.com
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --output /dev/null \
            --write-out '%{http_code}' --connect-timeout 10 --max-time 25 --retry 2 \
            "$WEB_BASE_URL/")"
          case "$status" in
            2*) echo "Website returned HTTP $status." ;;
            *) echo "::error::Website returned HTTP $status."; exit 1 ;;
          esac
