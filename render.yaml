services:
  - type: web
    name: wathiq-escrow-api
    runtime: node
    rootDir: api
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
  - type: web
    name: wathiq-escrow-web
    runtime: static
    rootDir: web
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: WATHIQ_API_BASE_URL
        sync: false
      - key: WATHIQ_ESCROW_ADDRESS
        sync: false
      - key: WATHIQ_TOKEN_ADDRESS
        sync: false
      - key: WATHIQ_CHAIN_ID
        value: "97"
      - key: WATHIQ_CHAIN_NAME
        value: BNB Smart Chain Testnet
      - key: WATHIQ_RPC_URL
        value: https://bsc-testnet-dataseed.bnbchain.org
      - key: WATHIQ_EXPLORER_URL
        value: https://testnet.bscscan.com
