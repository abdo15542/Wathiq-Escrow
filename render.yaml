services:
  - type: web
    name: wathiq-escrow-api
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/abdo15542/Wathiq-Escrow
    branch: fix/mobile-api-production-config
    rootDir: api
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://wathiq-escrow-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: wathiq-escrow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PGSSL_CA_CERT
        sync: false
  - type: web
    name: wathiq-escrow-web
    runtime: static
    repo: https://github.com/abdo15542/Wathiq-Escrow
    branch: fix/mobile-api-production-config
    rootDir: web
    buildCommand: npm run build
    staticPublishPath: dist
    envVars:
      - key: WATHIQ_API_BASE_URL
        value: https://wathiq-escrow-api.onrender.com
      - key: WATHIQ_ESCROW_ADDRESS
        value: ""
      - key: WATHIQ_TOKEN_ADDRESS
        value: ""
      - key: WATHIQ_CHAIN_ID
        value: "97"
      - key: WATHIQ_CHAIN_NAME
        value: BNB Smart Chain Testnet
      - key: WATHIQ_RPC_URL
        value: https://bsc-testnet-dataseed.bnbchain.org
      - key: WATHIQ_EXPLORER_URL
        value: https://testnet.bscscan.com

databases:
  - name: wathiq-escrow-db
    databaseName: wathiq_escrow_db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
